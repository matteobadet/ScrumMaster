apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de production — étend k8s/base/ avec l'Ingress Traefik/cert-manager, le Secret de
# connexion PostgreSQL et le Secret des identifiants Bot Framework (specs/002-poll-utilite-reunion).
# Strictement séparé des manifests SkillForge (Constitution Principe V).

resources:
  - ../../base
  - ingress.yaml

secretGenerator:
  - name: scrummaster-db-connection
    namespace: scrummaster
    # Copier connection.env.example vers connection.env (non commité) avant `kubectl apply -k`.
    envs:
      - connection.env
    type: Opaque
  - name: scrummaster-bot-credentials
    namespace: scrummaster
    # Copier bot-credentials.env.example vers bot-credentials.env (non commité) avant
    # `kubectl apply -k` — voir specs/002-poll-utilite-reunion/research.md#4.
    envs:
      - bot-credentials.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true
